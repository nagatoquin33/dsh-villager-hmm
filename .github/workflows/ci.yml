name: CI

on:
  push:
    branches: [main]
  pull_request:

# The package has no dependencies, so there is nothing to install and no
# lockfile to restore — the tests run directly against the checked-out source.
permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # Windows is in the matrix on purpose: this plugin is developed on
      # Windows, and a Windows-only failure (a .cmd spawn, a path separator)
      # would otherwise pass a Linux-only CI.
      matrix:
        os: [ubuntu-latest]
        node: ['22', '24']
        include:
          - os: windows-latest
            node: '22'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: Show the toolchain
        run: node --version

      - name: Install the dev dependency
        # Cordis is an optional peer; the boot test needs a real Context to
        # mount the plugin into. Consumers never install this.
        run: npm install

      - name: Match the npm the release workflow uses
        # The release job installs npm@latest. This job has to run the same one,
        # or a version-specific difference — like npm 12 returning an object
        # from `pack --json` where npm 11 returns an array — surfaces as a
        # failed tag push instead of as a CI failure.
        run: |
          npm install -g npm@latest
          npm --version

      - name: Run the hermetic suite
        run: npm test

      - name: Mount the plugin in a real cordis Context
        # This is the guard against a DSH/cordis update breaking the row at
        # boot: it actually imports and applies the host half.
        run: npm run test:boot

      - name: Assert the published artifact is code-only
        run: node test/assert-tarball.mjs

      - name: Fail if anything named like a Minecraft asset is committed
        # The repository must never carry Mojang material; this is the guard
        # that keeps a future commit from quietly adding it back.
        shell: bash
        run: |
          set -euo pipefail
          found="$(git ls-files | grep -Ei '\.(ogg|mp3|wav|png|jpg|jpeg|gif|webp)$' || true)"
          if [ -n "$found" ]; then
            echo "::error::binary asset(s) committed: $found"
            exit 1
          fi
          echo "no binary assets tracked"

      - name: Verify the manifest npm and the catalog read
        # The community catalog's static review checks exactly this: a
        # non-empty dsh.bundle.patch, and that the patch file exists.
        shell: bash
        run: |
          set -euo pipefail
          patch="$(node -p "require('./package.json').dsh.bundle.patch")"
          test -n "$patch" || { echo "::error::dsh.bundle.patch is empty"; exit 1; }
          test -f "$patch" || { echo "::error::dsh.bundle.patch points at a missing file: $patch"; exit 1; }
          echo "dsh.bundle.patch -> $patch"
